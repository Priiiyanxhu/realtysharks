name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Security problem? Report it privately instead (see SECURITY.md). Check docs/known-gaps.md first: the bug may already be known."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Sign in as a broker\n2. Open /messages\n3. ..."
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Page or route, device and browser, and screen width if it is a layout bug.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Remove any personal data first.
