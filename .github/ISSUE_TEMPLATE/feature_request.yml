name: Feature request
description: Suggest an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you would like it to work.
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and access
      description: Does this expose any broker's data to others? Who should be able to see or change it?
